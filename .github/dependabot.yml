version: 2

# A tool that audits other people's dependencies should keep its own current.
# Grouped, monthly updates keep the signal useful rather than noisy; the trust
# gate (lint + tests + eval + package build) runs on every resulting PR, so a
# dependency that breaks a citation guarantee cannot merge quietly.
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
